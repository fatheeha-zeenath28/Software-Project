
services:
  postgres:
    image: postgres:16
    container_name: alict-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alict
      POSTGRES_PASSWORD: alict123
      POSTGRES_DB: alict_db
    ports:
      - "5432:5432"
    volumes:
      - alict_pgdata:/var/lib/postgresql/data

volumes:
  alict_pgdata:
